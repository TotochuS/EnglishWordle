<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LexiForge — Menu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  <style>
    /* ── Menu-specific styles ── */
    .menu-hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 40px 20px 28px;
      text-align: center;
    }

    .hero-icon {
      font-size: 40px;
      color: var(--accent);
      filter: drop-shadow(0 0 16px rgba(245,166,35,0.5));
      margin-bottom: 4px;
    }

    .hero-title {
      font-family: var(--font-display);
      font-size: 38px;
      font-weight: 800;
      letter-spacing: -1px;
      color: var(--text-primary);
    }

    .hero-sub {
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    /* ── Length selector ── */
    .section-title {
      font-size: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--text-muted);
      text-align: center;
      margin-bottom: 16px;
    }

    .length-tabs {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 32px;
    }

    .length-tab {
      background: var(--bg-elevated);
      border: 1px solid var(--border-light);
      border-radius: var(--radius);
      padding: 10px 20px;
      font-family: var(--font-mono);
      font-size: 13px;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all var(--transition);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }

    .length-tab:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .length-tab.active {
      background: var(--accent-glow);
      border-color: var(--accent);
      color: var(--accent);
    }

    .length-tab .tab-letters {
      font-size: 18px;
      font-weight: 700;
    }

    .length-tab .tab-sub {
      font-size: 9px;
      letter-spacing: 1px;
      opacity: 0.7;
    }

    /* ── Level grid ── */
    .levels-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 14px;
      width: 100%;
      max-width: 700px;
      padding: 0 20px;
    }

    .level-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 22px 24px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 18px;
      position: relative;
      overflow: hidden;
      text-decoration: none;
    }

    .level-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--level-color, var(--accent-glow));
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .level-card:hover::before { opacity: 1; }

    .level-card:hover {
      border-color: var(--level-border, var(--accent));
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }

    .level-card.unavailable {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .level-card.unavailable:hover {
      transform: none;
      box-shadow: none;
    }

    .level-badge {
      font-family: var(--font-display);
      font-size: 24px;
      font-weight: 800;
      min-width: 52px;
      height: 52px;
      border-radius: var(--radius);
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--level-badge-bg, var(--bg-elevated));
      color: var(--level-badge-color, var(--text-primary));
      border: 1px solid var(--level-border, var(--border-light));
      flex-shrink: 0;
      position: relative;
      z-index: 1;
    }

    .level-info {
      flex: 1;
      position: relative;
      z-index: 1;
    }

    .level-name {
      font-family: var(--font-display);
      font-size: 15px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 3px;
    }

    .level-desc {
      font-size: 11px;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .level-arrow {
      font-size: 18px;
      color: var(--text-muted);
      position: relative;
      z-index: 1;
      transition: transform 0.2s ease;
    }

    .level-card:hover .level-arrow {
      transform: translateX(4px);
      color: var(--level-badge-color, var(--accent));
    }

    /* Level color themes */
    .level-A1 {
      --level-color: rgba(76, 175, 125, 0.08);
      --level-border: #2d6645;
      --level-badge-bg: #1a3d2b;
      --level-badge-color: #4caf7d;
    }
    .level-A2 {
      --level-color: rgba(100, 200, 140, 0.08);
      --level-border: #356e50;
      --level-badge-bg: #1e4533;
      --level-badge-color: #64c88c;
    }
    .level-B1 {
      --level-color: rgba(245, 166, 35, 0.08);
      --level-border: #a06a10;
      --level-badge-bg: #3d2e00;
      --level-badge-color: #f5a623;
    }
    .level-B2 {
      --level-color: rgba(255, 180, 60, 0.08);
      --level-border: #b07820;
      --level-badge-bg: #4a3800;
      --level-badge-color: #ffb43c;
    }
    .level-C1 {
      --level-color: rgba(180, 100, 220, 0.08);
      --level-border: #7a3a9a;
      --level-badge-bg: #300a4a;
      --level-badge-color: #c078e8;
    }
    .level-C2 {
      --level-color: rgba(220, 80, 80, 0.08);
      --level-border: #9a3030;
      --level-badge-bg: #3d0808;
      --level-badge-color: #e05252;
    }

    /* ── Nav bar (dict link) ── */
    .nav-dict {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--bg-elevated);
      border: 1px solid var(--border-light);
      border-radius: 30px;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-secondary);
      text-decoration: none;
      transition: all var(--transition);
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    }

    .nav-dict:hover {
      border-color: var(--accent);
      color: var(--accent);
      transform: translateY(-2px);
    }

    .dict-count {
      background: var(--accent);
      color: #0d0d0f;
      border-radius: 10px;
      padding: 1px 7px;
      font-size: 10px;
      font-weight: 700;
    }

    /* No words message */
    .no-words-msg {
      text-align: center;
      color: var(--text-muted);
      font-size: 12px;
      padding: 30px;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <div class="header-left">
      <span class="logo-icon">⬡</span>
      <span class="logo-text">LexiForge</span>
    </div>
    <div class="header-center">
      <span class="tagline">English Word Builder</span>
    </div>
    <div class="header-right">
      <a href="/dictionary" class="nav-dict" style="position:relative;bottom:auto;right:auto;box-shadow:none;">
        <span>📖</span> My Dictionary
        <span class="dict-count" id="header-dict-count">0</span>
      </a>
    </div>
  </header>

  <!-- HERO -->
  <div class="menu-hero">
    <div class="hero-icon">⬡</div>
    <h1 class="hero-title">Choose your challenge</h1>
    <p class="hero-sub">Select word length & difficulty level</p>
  </div>

  <!-- MAIN CONTENT -->
  <main style="width:100%;max-width:700px;margin:0 auto;padding:0 0 100px;">

    <!-- Length tabs -->
    <div style="padding: 0 20px 8px;">
      <p class="section-title">Word Length</p>
      <div class="length-tabs" id="length-tabs">
        <!-- Generated by JS -->
      </div>
    </div>

    <!-- Levels grid -->
    <div style="padding: 0 0 8px;">
      <p class="section-title">Difficulty Level</p>
      <div class="levels-grid" id="levels-grid">
        <!-- Generated by JS -->
      </div>
    </div>

  </main>

  <!-- Floating dict button -->
  <a href="/dictionary" class="nav-dict" id="float-dict-btn">
    <span>📖</span> My Dictionary
    <span class="dict-count" id="float-dict-count">0</span>
  </a>

  <script>
    const LEVEL_META = {
      A1: { name: "Beginner",       desc: "Everyday basic words — simple and familiar" },
      A2: { name: "Elementary",     desc: "Common words used in everyday conversation" },
      B1: { name: "Intermediate",   desc: "Practical vocabulary for varied topics" },
      B2: { name: "Upper-Inter.",   desc: "Richer vocabulary, more nuanced meanings" },
      C1: { name: "Advanced",       desc: "Sophisticated words used in educated speech" },
      C2: { name: "Mastery",        desc: "Rare, precise, and high-register vocabulary" },
    };

    let menuData = null;
    let selectedLength = null;

    async function loadMenu() {
      const resp = await fetch("/api/menu-data");
      menuData = await resp.json();

      const lengths = Object.keys(menuData.by_length).map(Number).sort((a,b) => a-b);
      selectedLength = lengths[0];

      renderLengthTabs(lengths);
      renderLevels();
      loadDictCount();
    }

    function renderLengthTabs(lengths) {
      const container = document.getElementById("length-tabs");
      container.innerHTML = "";
      lengths.forEach(len => {
        const tab = document.createElement("button");
        tab.className = "length-tab" + (len === selectedLength ? " active" : "");
        tab.innerHTML = `<span class="tab-letters">${"■".repeat(len)}</span><span class="tab-sub">${len} letters</span>`;
        tab.onclick = () => {
          selectedLength = len;
          document.querySelectorAll(".length-tab").forEach(t => t.classList.remove("active"));
          tab.classList.add("active");
          renderLevels();
        };
        container.appendChild(tab);
      });
    }

    function renderLevels() {
      const container = document.getElementById("levels-grid");
      container.innerHTML = "";

      const levelOrder = menuData.level_order;
      const available = menuData.by_length[selectedLength] || {};

      let hasAny = false;
      levelOrder.forEach(level => {
        const count = available[level] || 0;
        const meta = LEVEL_META[level];
        const unavailable = count === 0;
        if (!unavailable) hasAny = true;

        const card = document.createElement("a");
        card.className = `level-card level-${level}` + (unavailable ? " unavailable" : "");
        card.href = unavailable ? "#" : `/play?length=${selectedLength}&level=${level}`;

        card.innerHTML = `
          <div class="level-badge">${level}</div>
          <div class="level-info">
            <div class="level-name">${meta.name}</div>
            <div class="level-desc">${meta.desc}${unavailable ? ' — <em>no words yet</em>' : ` — ${count} word${count > 1 ? 's' : ''}`}</div>
          </div>
          <span class="level-arrow">${unavailable ? '✕' : '→'}</span>
        `;

        if (unavailable) {
          card.onclick = e => e.preventDefault();
        }

        container.appendChild(card);
      });

      if (!hasAny) {
        container.innerHTML = `<p class="no-words-msg">No words available for ${selectedLength}-letter words yet.</p>`;
      }
    }

    async function loadDictCount() {
      try {
        const resp = await fetch("/api/dictionary");
        const data = await resp.json();
        const count = data.words.length;
        document.getElementById("header-dict-count").textContent = count;
        document.getElementById("float-dict-count").textContent = count;
      } catch(e) {}
    }

    loadMenu();
  </script>
</body>
</html>
